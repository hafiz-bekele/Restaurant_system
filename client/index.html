<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant | Delicious Food & Reservations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('darkMode');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved !== null ? saved === 'true' : prefersDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      #initial-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #fafaf9;
        color: #1c1917;
        font-family: 'Poppins', 'Inter', system-ui, sans-serif;
        z-index: 99999;
        transition: opacity 0.25s ease;
      }
      .dark #initial-preloader {
        background-color: #030712;
        color: #f5f5f4;
      }
      .preloader-glow {
        position: absolute;
        width: 260px;
        height: 260px;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(249, 115, 22, 0.15) 0%, rgba(249, 115, 22, 0) 70%);
        pointer-events: none;
      }
      .preloader-icon-box {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #f59e0b 0%, #f97316 50%, #ea580c 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 28px -6px rgba(249, 115, 22, 0.45);
        margin-bottom: 20px;
      }
      .preloader-title {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 6px 0;
      }
      .preloader-sub {
        font-size: 12px;
        color: #78716c;
        margin: 0 0 28px 0;
        font-weight: 500;
      }
      .dark .preloader-sub {
        color: #a8a29e;
      }
      .preloader-spinner {
        width: 36px;
        height: 36px;
        animation: preloader-spin 0.85s linear infinite;
        margin-bottom: 18px;
      }
      @keyframes preloader-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .preloader-bar {
        width: 140px;
        height: 3px;
        background: #e7e5e4;
        border-radius: 99px;
        overflow: hidden;
        position: relative;
      }
      .dark .preloader-bar {
        background: #1f2937;
      }
      .preloader-bar-fill {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, #f97316, transparent);
        animation: preloader-sweep 1.2s ease-in-out infinite;
      }
      @keyframes preloader-sweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body class="bg-warm-50 dark:bg-gray-950 text-warm-900 dark:text-warm-100 antialiased">
    <div id="app">
      <!-- High-performance inline preloader visible before JS loads -->
      <div id="initial-preloader" aria-label="Loading application">
        <div class="preloader-glow"></div>
        <div class="preloader-icon-box">
          <svg style="width: 34px; height: 34px; color: #ffffff;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
            <line x1="6" y1="17" x2="18" y2="17"/>
          </svg>
        </div>
        <h1 class="preloader-title">Taste & Stay</h1>
        <p class="preloader-sub">Culinary Excellence & Boutique Living</p>
        <svg class="preloader-spinner" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="14" fill="none" stroke="currentColor" stroke-width="3" opacity="0.15"></circle>
          <circle cx="18" cy="18" r="14" fill="none" stroke="#f97316" stroke-width="3.5" stroke-dasharray="70" stroke-dashoffset="48" stroke-linecap="round"></circle>
        </svg>
        <div class="preloader-bar">
          <div class="preloader-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
